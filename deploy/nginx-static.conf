# Include inside the existing HTTPS server for 933944.ru.
# Keep its root (pointing to the deployed dist/), TLS and HTTP/2 settings.
# Replace conflicting location/gzip rules; do not append duplicate locations.
# The http context must already include the standard mime.types file.

index index.html;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css text/javascript application/javascript
           application/json application/xml image/svg+xml;

# Only build-generated, content-hashed files belong in /assets/.
# ^~ takes precedence over existing extension-based regex locations.
location ^~ /assets/ {
    try_files $uri =404;
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Public files have stable URLs and must be revalidated after updates.
location = /robots.txt {
    try_files $uri =404;
    default_type text/plain;
    expires off;
    add_header Cache-Control "no-cache";
}

location = /favicon.svg {
    try_files $uri =404;
    expires off;
    add_header Cache-Control "no-cache";
}

# Astro generates static pages; missing paths must return 404, not index.html.
location / {
    try_files $uri $uri/ =404;
    expires off;
    add_header Cache-Control "no-cache";
}
