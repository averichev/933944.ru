# Include inside the existing HTTPS server for 933944.ru.
# Keep its root (pointing to the deployed dist/), TLS and HTTP/2 settings.
# Replace conflicting location/gzip rules; do not append duplicate locations.
# The http context must already include the standard mime.types file.

index index.html;
error_page 404 /404.html;

# Use the original request so Nginx's internal index lookup cannot cause a loop.
# Preserve tracking/query parameters while removing duplicate HTML URLs.
if ($request_uri ~ "^([^?]*/)index\.html(?:\?|$)") {
    return 301 https://933944.ru$1$is_args$args;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css text/javascript application/javascript
           application/json application/xml image/svg+xml;

# Only build-generated, content-hashed files belong in /assets/.
# ^~ takes precedence over existing extension-based regex locations.
location ^~ /assets/ {
    try_files $uri =404;
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Public files have stable URLs and must be revalidated after updates.
location = /robots.txt {
    try_files $uri =404;
    default_type text/plain;
    expires off;
    add_header Cache-Control "no-cache";
}

location = /favicon.svg {
    try_files $uri =404;
    expires off;
    add_header Cache-Control "no-cache";
}

location ~ ^/sitemap-(index|[0-9]+)\.xml$ {
    try_files $uri =404;
    default_type application/xml;
    expires off;
    add_header Cache-Control "no-cache";
}

# error_page keeps the original 404 status. No redirect to a successful page.
location = /404.html {
    internal;
    expires off;
    add_header Cache-Control "no-cache" always;
}

# Astro generates static pages; missing paths must return 404, not index.html.
location / {
    try_files $uri $uri/ =404;
    expires off;
    add_header Cache-Control "no-cache";
}
